apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  # type: ClusterIP is used for in-cluster access. Change to
  # type: LoadBalancer if deploying on a cloud-managed cluster (e.g. GKE,
  # EKS, AKS) to expose the service externally via a cloud load balancer.
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
